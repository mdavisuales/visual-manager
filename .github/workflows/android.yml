
name: Compilar app Android

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Dirección de la plataforma (https://...). Si se deja vacía se usa la variable SITE_URL del repositorio."
        required: false

  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

jobs:
  apk:
    runs-on: ubuntu-latest

    env:
      SITE_URL: ${{ inputs.site_url || vars.SITE_URL }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - name: Verificar la dirección de la plataforma
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::Falta la dirección de la plataforma. Crea la variable SITE_URL en Settings > Secrets and variables > Actions > Variables, o escríbela al ejecutar el flujo."
            exit 1
          fi

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Preparar la firma propia (opcional)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          echo "KEYSTORE_FILE=release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Compilar el APK
        working-directory: android
        run: gradle :app:assembleRelease -PsiteUrl="$SITE_URL" -PversionCode="${{ github.run_number }}" --no-daemon

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: visuales-mda-app
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
